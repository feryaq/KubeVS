name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build extension and Connector release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: pnpm verify:release
      - name: Require tag to match extension version
        shell: pwsh
        run: |
          $version = (Get-Content apps/vscode-extension/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match extension version v$version"
          }
          "EXTENSION_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test production sources
        run: pnpm check
      - name: Test and build production Connector
        run: .\gradlew.bat :mods:kubevs-connector:test :mods:kubevs-connector:build --no-daemon
      - name: Assemble extension release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pnpm --filter kubevs-extension exec vsce package --no-dependencies --out "../../artifacts/kubevs-$env:EXTENSION_VERSION.vsix"
          Copy-Item "mods/kubevs-connector/build/libs/kubevs-$env:EXTENSION_VERSION.jar" "artifacts/kubevs-connector-$env:EXTENSION_VERSION.jar"
          Get-FileHash artifacts/* -Algorithm SHA256 | Format-Table
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = (Resolve-Path "artifacts/kubevs-$env:EXTENSION_VERSION.vsix").Path
          $connector = (Resolve-Path "artifacts/kubevs-connector-$env:EXTENSION_VERSION.jar").Path
          $notes = (Resolve-Path "docs/releases/$env:EXTENSION_VERSION.md").Path
          gh release create $env:GITHUB_REF_NAME $asset $connector --verify-tag --notes-file $notes --title "KubeVS $env:GITHUB_REF_NAME"
