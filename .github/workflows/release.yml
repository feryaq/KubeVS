name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build VS Code extension release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: pnpm verify:release
      - name: Require tag to match extension version
        shell: pwsh
        run: |
          $version = (Get-Content apps/vscode-extension/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match extension version v$version"
          }
          "EXTENSION_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test production sources
        run: pnpm check
      - name: Assemble extension release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pnpm --filter kubevs-extension exec vsce package --no-dependencies --out "../../artifacts/kubevs-$env:EXTENSION_VERSION.vsix"
          Get-FileHash artifacts/*.vsix -Algorithm SHA256 | Format-Table
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = (Resolve-Path "artifacts/kubevs-$env:EXTENSION_VERSION.vsix").Path
          gh release create $env:GITHUB_REF_NAME $asset --verify-tag --generate-notes --title "KubeVS $env:GITHUB_REF_NAME"
